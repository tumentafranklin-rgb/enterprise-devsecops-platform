apiVersion: apps/v1
kind: Deployment
metadata:
  name: enterprise-devsecops-api
  namespace: default
  labels:
    app: enterprise-devsecops-api
spec:
  replicas: 2

  selector:
    matchLabels:
      app: enterprise-devsecops-api

  template:
    metadata:
      labels:
        app: enterprise-devsecops-api

    spec:
      automountServiceAccountToken: false

      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: enterprise-devsecops-api

          image: 126309364316.dkr.ecr.us-east-1.amazonaws.com/aws-cicd-pipeline:10

          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 8000
              protocol: TCP

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"

          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3

---
apiVersion: v1
kind: Service
metadata:
  name: enterprise-devsecops-api
  namespace: default
  labels:
    app: enterprise-devsecops-api

spec:
  type: ClusterIP

  selector:
    app: enterprise-devsecops-api

  ports:
    - name: http
      port: 8000
      targetPort: http
      protocol: TCP
